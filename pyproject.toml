[project]
name = "gsm01-backend"
version = "0.1.0"
description = "GSM-01 — AI Agent CSKH dat xe & xu ly khieu nai (Xanh SM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
