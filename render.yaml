# Cấu hình deploy backend lên Render (ADR-001, ADR-002).
# Bí mật KHÔNG nằm trong file này — đặt trong Environment của dashboard Render.
services:
  - type: web
    name: gsm01-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: ENVIRONMENT
        value: production
      # Model đã đo TTFT thật — xem ADR-008. Đừng đổi khi chưa đo lại.
      - key: LLM_ROUTER_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_ANSWER_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_EMBEDDING_DIM
        value: "768"
      - key: GEMINI_RPM
        value: "15"
      # Quota Google đang chốt: 15 RPM / 250.000 TPM / 500 RPD.
      # GEMINI_RPM là giới hạn client tự giãn nhịp; TPM/RPD do Google áp dụng theo project.
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      # Provider dự phòng theo chuẩn OpenAI — tạm tắt vì các provider hiện tại chưa ổn định.
      # Khi có provider mới đã kiểm chứng: bật FALLBACK_ENABLED rồi đổi các biến bên dưới.
      - key: FALLBACK_ENABLED
        value: "false"
      - key: FALLBACK_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: FALLBACK_MODEL
        value: qwen/qwen3.8-max-free
      - key: FALLBACK_PROVIDER_NAME
        value: tokenrouter
      - key: FALLBACK_EXTRA_BODY
        value: '{"reasoning_effort":"low"}'
      - key: FALLBACK_MIN_MAX_TOKENS
        value: "800"
      # Các biến sync:false phải nhập tay trong dashboard Render:
      #   DATABASE_URL      — connection string của Neon (có ?sslmode=require)
      #   GEMINI_API_KEY
      #   JWT_SECRET        — chuỗi ngẫu nhiên MỚI, không dùng lại của máy cá nhân
      #   CORS_ORIGINS      — https://<tên-app>.vercel.app
      #   OPENROUTER_API_KEY / FALLBACK_API_KEY — để trống khi FALLBACK_ENABLED=false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FALLBACK_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
